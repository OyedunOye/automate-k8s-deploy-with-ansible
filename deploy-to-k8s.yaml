---
- name: Deploy app in new namespace
  hosts: localhost
  vars:
    ansible_python_interpreter: /home/oluwasade/.local/share/virtualenvs/ansible-project-2Stdgwn8/bin/python3
  tasks:
    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: /home/oluwasade/terraform/kubeconfig_my-app-eks-cluster

    - name: Deploy nginx app
      kubernetes.core.k8s: 
        src: /home/oluwasade/autoscaler-config/nginx-config.yaml
        state: present
        kubeconfig: /home/oluwasade/terraform/kubeconfig_my-app-eks-cluster
        namespace: my-app