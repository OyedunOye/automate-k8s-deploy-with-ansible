---
- name: Deploy app in new namespace
  hosts: localhost
  vars_files:
    - project-vars
  tasks:
    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Deploy nginx app
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/nginx-config.yaml"
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        namespace: my-app
